# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: James kirika
email: jkirika20@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Electrical & Electronics Engineering graduate turned quant developer, now
  building toward cybersecurity. Three-plus years writing MQL4/5 trading
  software, with hands-on work in WSS encryption, SSL, and token-based auth
  for live trading data bridges. This blog tracks that shift — from an
  anti-tampering smart meter project to the Cyber Shujaa Cloud and Networking track.
twitter_username: jimkirika
github_username: Sir-kirika
minimal_mistakes_skin: neon
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "James Kirika"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "EEE grad & quant dev moving into cybersecurity. Builds secure trading data bridges (WSS, SSL, token auth). Cyber Shujaa trainee."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/jimkirika"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Sir-kirika"
    - label: "Cyber Shujaa"
      icon: "fab fa-fw fa-shield-alt"
      url: "https://cybershujaa.co.ke"

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Sir-kirika"
    - label: "Cyber Shujaa"
      icon: "fab fa-fw fa-shield-alt"
      url: "https://cybershujaa.co.ke"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
